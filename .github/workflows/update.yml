name: Weekly Update

on:
  schedule:
    # 每周日 22:00 UTC = 每周一 06:00 北京时间
    - cron: '0 22 * * 0'
  workflow_dispatch:  # 手动触发（测试/补跑用）

permissions:
  contents: write  # 允许 GITHUB_TOKEN push 回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch models + stars + build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. 刷新模型数据（价格/综合/逻辑/汇率） ==="
          python scripts/fetch_models.py
          echo ""
          echo "=== 2. 刷新 GitHub 星数 + 重建 data.js ==="
          python scripts/fetch_github.py --build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: weekly update $(date -u +'%Y-%m-%d')" || echo "no changes"
          git push
